<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Greek Flashcards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- iOS web app hints -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    /* Light theme defaults */
    :root {
      --bg: #f8fafc;
      --fg: #0f172a;
      --card-bg: #ffffff;
      --accent: #2563eb;
      --accent-soft: #e0edff;
      --muted: #64748b;
      --divider: #e2e8f0;
    }

    /* Dark theme overrides */
    body.dark {
      --bg: #020617;
      --fg: #e5e7eb;
      --card-bg: #020617;
      --accent: #38bdf8;
      --accent-soft: #0b1120;
      --muted: #94a3b8;
      --divider: #1e293b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      justify-content: center;
    }

    /* Shell: full height, three zones */
    .app-shell {
      flex: 1;
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    .top-bar {
      flex: 0 0 48px;
      padding: 8px 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .topic-button {
      border-radius: 999px;
      border: 1px solid transparent;
      background: var(--accent-soft);
      color: var(--fg);
      font-weight: 600;
      padding: 4px 10px;
      cursor: pointer;
    }

    .settings-button {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* Middle area: split 50/50 between prompt and translation */
    .main-card-area {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      padding: 8px 12px;
    }

    .card-half {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-half-top {
      border-bottom: 1px solid var(--divider);
    }

    .prompt-main,
    .translation-main {
      flex: 1 1 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #prompt {
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1.3;
      white-space: pre-line;
      word-wrap: break-word;
      max-width: 360px;
    }

    #translationText {
      font-size: 1.4rem;
      line-height: 1.3;
      white-space: pre-line;
      word-wrap: break-word;
      max-width: 360px;
    }

    .prompt-phon,
    .translation-phon {
      flex: 0 0 auto;
      min-height: 24px;
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    #promptPhonetic,
    #translationPhonetic {
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 360px;
      text-align: center;
    }

    .fade-target {
      opacity: 0;
      visibility: hidden;
      transition: opacity 160ms ease-out;
    }
    .fade-target.visible {
      opacity: 1;
      visibility: visible;
    }

    /* Bottom bar: all buttons + progress, safe-area aware */
    .bottom-fixed-bar {
      flex: 0 0 auto;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      background: var(--bg);
    }

    .bottom-fixed-bar-inner {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-row {
      display: flex;
      gap: 8px;
    }

    button.primary,
    button.secondary {
      width: 100%;
      border-radius: 999px;
      border: 1px solid transparent;
      padding: 10px 16px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 500;
      background: var(--card-bg);
      color: var(--fg);
      transition: background-color 120ms ease-out, color 120ms ease-out, border-color 120ms ease-out;
    }

    button.primary {
      background: var(--accent-soft);
      border-color: var(--accent);
      font-weight: 600;
    }

    button.secondary {
      border-color: var(--accent);
      color: var(--accent);
      background: transparent;
    }

    /* Ensure Previous/Next match theme */
    .nav-row button {
      flex: 1;
      background: var(--card-bg);
      color: var(--fg);
      border-color: var(--muted);
    }

    .progress {
      margin-top: 2px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px 16px 20px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .modal-close {
      border: none;
      background: transparent;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--muted);
    }

    .modal-section {
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .modal-section label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .modal-section select,
    .modal-section input[type="checkbox"] {
      margin-top: 2px;
    }

    /* Small iPhone / short viewport adjustments */
    @media (max-height: 750px) {
      .top-bar {
        flex: 0 0 40px;
        padding-top: 4px;
      }

      .main-card-area {
        padding: 4px 8px;
      }

      #prompt {
        font-size: 1.4rem;
      }

      #translationText {
        font-size: 1.25rem;
      }

      #promptPhonetic,
      #translationPhonetic {
        font-size: 1rem;
      }

      .bottom-fixed-bar {
        padding: 6px 10px calc(6px + env(safe-area-inset-bottom));
      }

      button.primary,
      button.secondary {
        padding: 8px 14px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Top bar -->
    <div class="top-bar">
      <button id="topicButton" class="topic-button">Alphabet</button>
      <button id="settingsButton" class="settings-button" aria-label="Settings">⚙️</button>
    </div>

    <!-- Middle: prompt half + translation half -->
    <div class="main-card-area">
      <div class="card-half card-half-top">
        <div class="prompt-main">
          <div id="prompt">Loading…</div>
        </div>
        <div class="prompt-phon">
          <div id="promptPhonetic" class="fade-target"></div>
        </div>
      </div>

      <div class="card-half card-half-bottom">
        <div class="translation-main">
          <div id="translationText" class="fade-target"></div>
        </div>
        <div class="translation-phon">
          <div id="translationPhonetic" class="fade-target"></div>
        </div>
      </div>
    </div>

    <!-- Bottom: all buttons + progress -->
    <div class="bottom-fixed-bar">
      <div class="bottom-fixed-bar-inner">
        <div class="control-row">
          <button id="showTranslationBtn" class="primary">Show Translation</button>
          <button id="showPhoneticsBtn" class="secondary fade-target">Show Phonetics</button>
        </div>
        <div class="nav-row">
          <button id="prevBtn">Previous</button>
          <button id="nextBtn">Next</button>
        </div>
        <div id="progress" class="progress">Card 0 of 0</div>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModalBackdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-header">
        <div id="settingsTitle" class="modal-title">Settings</div>
        <button id="settingsClose" class="modal-close" aria-label="Close settings">✕</button>
      </div>

      <div class="modal-section">
        <label for="promptLanguageSelect">Prompt language</label>
        <select id="promptLanguageSelect">
          <option value="en">English</option>
          <option value="el">Greek</option>
          <option value="random">Random</option>
        </select>
      </div>

      <div class="modal-section">
        <label>
          <input type="checkbox" id="shuffleCheckbox" />
          Shuffle cards
        </label>
      </div>

      <div class="modal-section">
        <label for="themeSelect">Theme</label>
        <select id="themeSelect">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Topic picker modal -->
  <div id="topicModalBackdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="topicTitle">
      <div class="modal-header">
        <div id="topicTitle" class="modal-title">Choose a topic</div>
        <button id="topicClose" class="modal-close" aria-label="Close topic picker">✕</button>
      </div>

      <div class="modal-section">
        <button class="secondary" data-topic="Alphabet">Alphabet</button>
      </div>
      <div class="modal-section">
        <button class="secondary" data-topic="Articles and Genders">Articles and Genders</button>
      </div>
      <div class="modal-section">
        <button class="secondary" data-topic="Verb είμαι">Verb είμαι</button>
      </div>
      <div class="modal-section">
        <button class="secondary" data-topic="Numbers 0-10">Numbers 0-10</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
