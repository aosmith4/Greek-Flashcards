<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Greek Flashcards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f8fafc;
      --fg: #0f172a;
      --card-bg: #ffffff;
      --accent: #2563eb;
      --accent-soft: #2563eb10;
      --muted: #64748b;
      --divider: #e2e8f0;
    }
    body.dark {
      --bg: #020617;
      --fg: #e5e7eb;
      --card-bg: #020617;
      --accent: #38bdf8;
      --accent-soft: #0b1120;
      --muted: #94a3b8;
      --divider: #1e293b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      justify-content: center;
    }

    .app {
      max-width: 480px;
      width: 100%;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .topic-button {
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--accent);
      font-weight: 600;
      padding: 4px 10px;
      cursor: pointer;
    }
    body.dark .topic-button {
      background: var(--accent-soft);
      border-color: #1e293b;
      color: #e0f2fe;
    }

    .settings-button {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .card {
      flex: 1;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
      display: flex;
      flex-direction: column;
    }

    .card-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px 12px;
      gap: 16px;
    }

    .slot-prompt {
      width: 100%;
      max-width: 360px;
      height: 190px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      text-align: center;
    }

    #prompt {
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1.3;
      word-wrap: break-word;
      white-space: pre-line;
    }

    .slot-prompt-phon {
      width: 100%;
      max-width: 360px;
      height: 52px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    #promptPhonetic {
      font-size: 1.1rem;
      color: var(--muted);
    }

    .translation-wrapper {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 16px;
    }

    .translation-divider {
      border-top: 1px solid var(--divider);
      margin: 0 auto;
      width: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 160ms ease-out;
    }
    .translation-divider.visible {
      opacity: 1;
      visibility: visible;
    }

    .slot-translation {
      width: 100%;
      height: 190px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      text-align: center;
    }

    #translationText {
      font-size: 1.4rem;
      line-height: 1.3;
      white-space: pre-line;
      word-wrap: break-word;
    }

    .slot-translation-phon {
      width: 100%;
      height: 40px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    #translationPhonetic {
      font-size: 1.1rem;
      color: var(--muted);
    }

    .control-band {
      margin-top: 8px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-self: center;
    }

    button.primary,
    button.secondary {
      width: 100%;
      border-radius: 999px;
      border: 1px solid transparent;
      padding: 10px 16px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 120ms ease-out, color 120ms ease-out, border-color 120ms ease-out;
    }

    button.primary {
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }
    body.dark button.primary {
      background: var(--accent-soft);
      border-color: #1e293b;
      color: #e0f2fe;
    }

    button.secondary {
      background: transparent;
      color: var(--accent);
      border-color: var(--accent);
    }
    body.dark button.secondary {
      background: transparent;
      color: #e0f2fe;
      border-color: #1e293b;
    }

    .fade-target {
      opacity: 0;
      visibility: hidden;
      transition: opacity 160ms ease-out;
    }
    .fade-target.visible {
      opacity: 1;
      visibility: visible;
    }

    .bottom-bar {
      margin-top: 8px;
    }

    .nav-row {
      display: flex;
      gap: 8px;
    }

    .nav-row button {
      flex: 1;
      border-radius: 999px;
      border: 1px solid var(--muted);
      background: transparent;
      color: var(--fg);
      padding: 10px 0;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .progress {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px 16px 20px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .modal-close {
      border: none;
      background: transparent;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--muted);
    }

    .modal-section {
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .modal-section label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .modal-section select,
    .modal-section input[type="checkbox"] {
      margin-top: 2px;
    }

    /* Small-height optimization for phones (e.g., iPhone 15 browser) */
    @media (max-height: 750px) {
      .app {
        padding: 8px;
      }

      .card {
        padding: 12px;
      }

      .card-inner {
        padding-top: 8px;
        padding-bottom: 8px;
        gap: 12px;
      }

      .slot-prompt {
        height: 150px;
      }

      .slot-translation {
        height: 150px;
      }

      .control-band {
        margin-top: 4px;
      }

      .bottom-bar {
        margin-top: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <button id="topicButton" class="topic-button">Alphabet</button>
      <button id="settingsButton" class="settings-button" aria-label="Settings">⚙️</button>
    </div>

    <div class="card">
      <div class="card-inner">
        <div class="slot-prompt">
          <div id="prompt">Loading…</div>
        </div>

        <div class="slot-prompt-phon">
          <div id="promptPhonetic" class="fade-target"></div>
        </div>

        <div class="translation-wrapper">
          <div id="translationDivider" class="translation-divider"></div>

          <div class="slot-translation">
            <div id="translationText" class="fade-target"></div>
          </div>

          <div class="slot-translation-phon">
            <div id="translationPhonetic" class="fade-target"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="control-band">
      <button id="showTranslationBtn" class="primary">Show Translation</button>
      <button id="showPhoneticsBtn" class="secondary fade-target">Show Phonetics</button>
    </div>

    <div class="bottom-bar">
      <div class="nav-row">
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
      </div>
      <div id="progress" class="progress">Card 0 of 0</div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModalBackdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-header">
        <div id="settingsTitle" class="modal-title">Settings</div>
        <button id="settingsClose" class="modal-close" aria-label="Close settings">✕</button>
      </div>

      <div class="modal-section">
        <label for="promptLanguageSelect">Prompt language</label>
        <select id="promptLanguageSelect">
          <option value="en">English</option>
          <option value="el">Greek</option>
          <option value="random">Random</option>
        </select>
      </div>

      <div class="modal-section">
        <label>
          <input type="checkbox" id="shuffleCheckbox" />
          Shuffle cards
        </label>
      </div>

      <div class="modal-section">
        <label for="themeSelect">Theme</label>
        <select id="themeSelect">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Topic picker modal -->
  <div id="topicModalBackdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="topicTitle">
      <div class="modal-header">
        <div id="topicTitle" class="modal-title">Choose a topic</div>
        <button id="topicClose" class="modal-close" aria-label="Close topic picker">✕</button>
      </div>

      <div class="modal-section">
        <button class="secondary" data-topic="Alphabet">Alphabet</button>
      </div>
      <div class="modal-section">
        <button class="secondary" data-topic="Articles and Genders">Articles and Genders</button>
      </div>
      <div class="modal-section">
        <button class="secondary" data-topic="Verb είμαι">Verb είμαι</button>
      </div>
      <div class="modal-section">
        <button class="secondary" data-topic="Numbers 0-10">Numbers 0-10</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
