<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Greek Flashcards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="app-header">
      <h1>Greek Flashcards</h1>
    </header>

    <main class="content">
      <div class="card">
        <div class="prompt" id="promptText">
          Γεια σου
        </div>
        <div class="phonetic" id="phoneticText">
          geia sou
        </div>
        <div class="translation" id="translationText">
          Hello
        </div>
      </div>
    </main>

    <div class="button-bar">
      <button id="prevBtn">Previous</button>
      <button id="phoneticBtn">Show Phonetic</button>
      <button id="translationBtn" class="primary">Show Translation</button>
      <button id="nextBtn">Next</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
